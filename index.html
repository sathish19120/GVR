<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3B6D11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GVR" />
    <meta name="description" content="Green Village Rice — Fresh farm-to-home Sona Masoori rice delivered across Hyderabad." />
    <title>Green Village Rice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 16px; -webkit-text-size-adjust: 100%; height: -webkit-fill-available; overflow-x: hidden; }
      body { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; overflow-x: hidden; min-height: 100vh; min-height: -webkit-fill-available; background: #F4F6F3; width: 100%; }
      #root { min-height: 100vh; min-height: -webkit-fill-available; width: 100%; overflow-x: hidden; }
      input, select, textarea, button { font-family: inherit; font-size: 16px !important; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      * { -webkit-overflow-scrolling: touch; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
