@"
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gvr-app-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gvr-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
"@ | Out-File -Encoding utf8 -NoNewline k8s/hpa.yaml
